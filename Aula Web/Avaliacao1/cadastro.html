<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Empresa XYZ</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html"><img src="esp-logo.png" alt="ESP"></a>
        </div>
        <div class="auth-info" id="auth-info">
        </div>
    </header>

    <div class="container">
        <nav class="menu">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="#">Serviços</a></li>
                <li><a href="login.html" class="login-link">LOGIN</a></li>
            </ul>
        </nav>

        <main>
            <h2>Cadastro de Usuário</h2>
            
            <div class="tema">
                <label for="estilo-form"><strong>Tema:</strong></label>
                <select id="estilo-form" onchange="mudarEstilo()">
                    <option value="Padrão">Padrão</option>
                    <option value="custom">Custom</option>
                </select>
            </div>

            <hr>

            <form id="cadastro-form" action="#" method="POST">
                <label for="nome">Nome Completo:</label><br>
                <input type="text" id="nome" name="nome"><br><br>

                <label for="email">E-mail de Contato:</label><br>
                <input type="email" id="email" name="email"><br><br>

                <label for="nascimento">Data de Nascimento:</label><br>
                <input type="date" id="nascimento" name="nascimento"><br><br>

                <label>Instrumento principal:</label><br>
                <input type="radio" id="Guitarra" name="instrumento" value="Guitarra">
                <label for="Guitarra">Guitarra</label>
                <input type="radio" id="Baixo" name="instrumento" value="Baixo">
                <label for="Baixo">Baixo</label><br><br>

                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Receber novidades de novos produtos</label><br><br>
                
                <label for="cidade">Cidade:</label><br>
                <input type="text" id="cidade" name="cidade"><br><br>

                <button type="submit">Enviar Dados</button>
            </form>
        </main>
    </div>

    <footer>
        <p>aluno: Eduardo</p>
    </footer>
</body>
</html>
