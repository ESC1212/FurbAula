<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Empresa XYZ</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html"><img src="esp-logo.png" alt="ESP"></a>
        </div>
        <div class="auth-info" id="auth-info">
        </div>
    </header>

    <div class="container">
        <nav class="menu">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="#">Serviços</a></li>
                <li><a href="login.html" class="login-link">LOGIN</a></li>
            </ul>
        </nav>

    <main class="login-main">
        <div class="login-box">
            <h2>Login</h2>
            <form id="login-form">
                <label for="login">Login:</label><br>
                <input type="text" id="login" name="login" required><br><br>
                
                <label for="senha">Senha:</label><br>
                <input type="password" id="senha" name="senha" required><br><br>
                 
                <button type="button" onclick="fazerLogin()">Autenticar</button>
            </form>
        </div>
    </main>
    </div>

    <footer>
        <p>Integrantes da Equipe: João da Silva, Maria Souza e José Santos</p>
    </footer>
</body>
</html>
