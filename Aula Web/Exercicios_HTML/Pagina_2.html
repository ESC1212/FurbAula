<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício HTML - parte 2</title>
    <!-- Utilizando o mesmo arquivo CSS da Parte 1 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        Formulário
    </header>

    <form>
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome"><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="idade">Idade:</label><br>
        <input type="number" id="idade" name="idade" min="0" max="100"><br><br>

        <label for="nascimento">Data de Nascimento:</label><br>
        <input type="date" id="nascimento" name="nascimento"><br><br>

        <label for="senha">Senha de Acesso:</label><br>
        <input type="password" id="senha" name="senha"><br><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>

</body>
</html>
